name: AnimeHeaven
options:
  bundleIdPrefix: me.animeheaven
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

packages:
  AnimeHeavenCore:
    path: Packages/AnimeHeavenCore

targets:
  AnimeHeaven:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AnimeHeavenApp
    dependencies:
      - package: AnimeHeavenCore
        product: AnimeHeavenCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.animeheaven.ios
        PRODUCT_NAME: AnimeHeaven
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: AnimeHeavenApp/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule

  AnimeHeavenUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: AnimeHeavenUITests
    dependencies:
      - target: AnimeHeaven
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.animeheaven.ios.uitests
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: AnimeHeaven
        INFOPLIST_FILE: AnimeHeavenUITests/Info.plist

schemes:
  AnimeHeaven:
    build:
      targets:
        AnimeHeaven: all
        AnimeHeavenUITests: [test]
    test:
      config: Debug
      targets:
        - AnimeHeavenUITests
    run:
      config: Debug
    archive:
      config: Release
