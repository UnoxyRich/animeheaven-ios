name: iOS Build, Core Tests & Simulator UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  core-tests:
    name: AnimeHeavenCore SwiftPM Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run SwiftPM unit tests, release build & self-test
        working-directory: Packages/AnimeHeavenCore
        run: |
          swift test
          swift build -c release
          swift run AnimeHeavenCoreSelfTest

  ios-simulator-ui-tests:
    name: Real iOS Simulator Build & XCUITests
    runs-on: macos-15
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Xcode & ensure iOS Simulator runtime is installed
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes iOS | grep -q "iOS"; then
            echo "Downloading iOS Simulator runtime..."
            xcodebuild -downloadPlatform iOS
          fi

      - name: Select or create and boot an iPhone Simulator
        id: sim
        run: |
          SIM_UDID=$(xcrun simctl list devices available iPhone -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      print(d["udid"])
                      sys.exit(0)
          ')
          if [ -z "$SIM_UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes iOS -j | python3 -c '
            import json, sys
            rts = [r for r in json.load(sys.stdin).get("runtimes", []) if r.get("isAvailable") and "iOS" in r.get("identifier", "")]
            print(rts[-1]["identifier"] if rts else "")
            ')
            SIM_UDID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME_ID")
          fi
          echo "Booting simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run real XCUITests on booted iOS Simulator
        run: |
          xcodebuild test \
            -project AnimeHeaven.xcodeproj \
            -scheme AnimeHeaven \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Capture Simulator UI Screenshot
        if: always()
        run: |
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot ios-ui-screenshot.png || true

      - name: Upload XCUITest Result Bundle & Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animeheaven-ios-ui-tests
          path: |
            TestResults.xcresult
            ios-ui-screenshot.png
