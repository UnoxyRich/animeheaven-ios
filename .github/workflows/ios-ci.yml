name: iOS Build, Core Tests & Simulator UI Tests

on:
  push:
    branches: [ main, netflix-ui, "fix/**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: AnimeHeavenCore SwiftPM Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Run SwiftPM unit tests, release build & self-test
        working-directory: Packages/AnimeHeavenCore
        run: |
          swift build -Xswiftc -strict-concurrency=complete
          swift test
          swift build -c release
          swift run AnimeHeavenCoreSelfTest

  ios-simulator-ui-tests:
    name: Real iOS Simulator Build, XCUITests & Screenshots
    runs-on: macos-15
    timeout-minutes: 30
    needs: core-tests
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Build unsigned iOS Release
        run: |
          xcodebuild build \
            -project AnimeHeaven.xcodeproj \
            -scheme AnimeHeaven -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Inspect Xcode & ensure iOS Simulator runtime is installed
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          if ! xcrun simctl list runtimes iOS | grep -q 'iOS 26\.2'; then
            xcodebuild -downloadPlatform iOS -buildVersion 26.2
          fi

      - name: Select or create and boot an iPhone Simulator
        id: sim
        run: |
          SIM_UDID=$(xcrun simctl list devices available iPhone -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in sorted(data.get("devices", {}).items(), reverse=True):
              if not runtime.endswith("iOS-26-2"):
                  continue
              for d in devices:
                  if d.get("isAvailable") and "iPhone" in d.get("name", ""):
                      candidates.append(d)
          preferred = [d for d in candidates if d.get("name") == "iPhone 16"]
          if not preferred:
              preferred = [d for d in candidates if "iPhone 16" in d.get("name", "")]
          if not preferred:
              preferred = candidates
          if preferred:
              print(preferred[0]["udid"])
          ')
          if [ -z "$SIM_UDID" ]; then
            RUNTIME_ID=$(xcrun simctl list runtimes iOS -j | python3 -c '
            import json, sys
            rts = [r for r in json.load(sys.stdin).get("runtimes", []) if r.get("isAvailable") and r["identifier"].endswith("iOS-26-2")]
            print(rts[-1]["identifier"] if rts else "")
            ')
            SIM_UDID=$(xcrun simctl create "CI-iPhone" "com.apple.CoreSimulator.SimDeviceType.iPhone-16" "$RUNTIME_ID")
          fi
          echo "Booting simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          # Suppress QuickPath / Slide-to-Type keyboard onboarding popover in CI
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences KeyboardAutocorrection -bool false || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.Preferences KeyboardPrediction -bool false || true
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          echo "udid=$SIM_UDID" >> "$GITHUB_OUTPUT"

      - name: Build & run real XCUITests walkthrough on booted iOS Simulator
        run: |
          xcodebuild test \
            -project AnimeHeaven.xcodeproj \
            -scheme AnimeHeaven \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export PNG screenshots from TestResults.xcresult
        if: always()
        run: |
          mkdir -p xcresult-attachments screenshots
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path xcresult-attachments || true
          python3 - <<'PY'
          import json, os, shutil

          src_dir = "xcresult-attachments"
          dst_dir = "screenshots"
          os.makedirs(dst_dir, exist_ok=True)
          manifest_path = os.path.join(src_dir, "manifest.json")
          copied = 0

          if os.path.exists(manifest_path):
              entries = json.load(open(manifest_path))
              for test_entry in entries:
                  for att in test_entry.get("attachments", []):
                      exported = att.get("exportedFileName", "")
                      suggested = att.get("suggestedHumanReadableName", "")
                      src = os.path.join(src_dir, exported)
                      if exported and os.path.exists(src) and src.lower().endswith(".png"):
                          base = suggested.split("_")[0] if suggested else os.path.splitext(exported)[0]
                          if not base.lower().endswith(".png"):
                              base += ".png"
                          shutil.copy2(src, os.path.join(dst_dir, base))
                          copied += 1

          if copied == 0:
              for root, _, files in os.walk(src_dir):
                  for idx, fn in enumerate(sorted(files), 1):
                      if fn.lower().endswith(".png"):
                          shutil.copy2(os.path.join(root, fn), os.path.join(dst_dir, f"{idx:02d}-{fn}"))
                          copied += 1

          print(f"Exported {copied} PNG screenshots to {dst_dir}/")
          PY
          ls -lh screenshots/

      - name: Require the complete iOS walkthrough
        run: |
          for number in 01 02 03 04 05 06 07 08 09 10; do
            compgen -G "screenshots/$number-ios-*.png" >/dev/null
          done

      - name: Upload iOS App Screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-ios-screenshots
          path: screenshots/*.png

      - name: Upload XCUITest Result Bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: animeheaven-ios-ui-tests
          path: TestResults.xcresult
